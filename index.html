
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f1e8">
<title>такие милые котеке(˵♡ᴗ♡˵)</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:28px 16px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#f7f1e8;
 color:#443a34;
 text-align:center;
 font-family:Georgia,serif
}

main{width:100%;max-width:520px}

h1{
 font-weight:400;
 font-size:clamp(28px,7vw,40px);
 margin:14px 0
}

p{color:#8b7c70}

.frame{
 padding:9px;
 border:1px solid #e7d9cc;
 background:#fff9f2;
 min-height:150px;
 display:flex;
 align-items:center;
 justify-content:center
}

img{
 width:100%;
 max-height:65vh;
 object-fit:contain;
 display:none
}

button{
 margin-top:8px;
 padding:13px 22px;
 border:1px solid #cdb7a7;
 border-radius:30px;
 background:transparent;
 color:#443a34;
 font-size:14px
}
</style>
</head>

<body>
<main>

 <h1>такие милые котеке(˵♡ᴗ♡˵)</h1>

 <p>мяумяумяумяумяуууууууу</p>

 <div class="frame">
  <img id="photo" alt="хехехехехе">
  <p id="status">загружаю котиков ♡</p>
 </div>

 <p id="caption"></p>

 <button onclick="showRandom()">
  ищоооооооо
 </button>

</main>

<script>
const owner=location.hostname.split('.')[0];
const repo=location.pathname.split('/').filter(Boolean)[0]||'';

let photos=[];
let deck=[];
let lastPhoto=null;
let loading=false;

// Получаем фотографии из GitHub
async function loadPhotos(){
 const status=document.getElementById('status');

 try{
  const response=await fetch(
   `https://api.github.com/repos/${owner}/${repo}/contents/photos`,
   {cache:'no-store'}
  );

  if(!response.ok){
   throw new Error('GitHub API: '+response.status);
  }

  const files=await response.json();

  photos=files
   .filter(f=>f.type==='file'&&
    /\.(jpe?g|png|webp|gif)$/i.test(f.name))
   .map(f=>f.download_url)
   .filter(Boolean);

  if(!photos.length){
   status.textContent='Пока нет фотографий ♡';
   return;
  }

  status.style.display='none';
  showRandom();

 }catch(error){
  console.error(error);
  status.textContent='Не удалось загрузить фотографии ♡';
 }
}

// Перемешивание без повторений
function shufflePhotos(){
 deck=[...photos];

 for(let i=deck.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [deck[i],deck[j]]=[deck[j],deck[i]];
 }

 // Не допускаем повтора между циклами
 if(deck.length>1&&deck[deck.length-1]===lastPhoto){
  [deck[0],deck[deck.length-1]]=
  [deck[deck.length-1],deck[0]];
 }
}

// Показываем следующую фотографию
async function showRandom(){
 if(loading||!photos.length)return;

 loading=true;

 const img=document.getElementById('photo');
 const status=document.getElementById('status');
 const caption=document.getElementById('caption');

 img.style.display='none';
 status.style.display='block';
 status.textContent='ищем котиков ♡';

 while(photos.length){
  if(!deck.length){
   shufflePhotos();
  }

  const next=deck.pop();

  try{
   await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
    img.src=next;
   });

   lastPhoto=next;
   img.style.display='block';
   status.style.display='none';
   caption.textContent='мурррррррррррррррррр♡';

   loading=false;
   return;

  }catch(error){
   console.warn('ой:',next);

   photos=photos.filter(photo=>photo!==next);
   deck=deck.filter(photo=>photo!==next);
  }
 }

 status.style.display='block';
 status.textContent='блен чет не то';
 caption.textContent='';

 loading=false;
}

loadPhotos();
</script>

</body>
</html>
